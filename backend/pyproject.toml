[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sporttery-advisor-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    # Database
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    # Cache / queue
    "redis[hiredis]>=5.0,<6",
    # LLM
    "anthropic>=0.40,<1",
    "openai>=1.50,<2",
    "google-genai>=1.0,<2",
    "httpx>=0.27,<1",
    # Statistics / modeling
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "duckdb>=1.3,<2",
    # Scraping
    "playwright>=1.45,<2",
    "beautifulsoup4>=4.12,<5",
    "aiohttp>=3.10,<4",
    # Scheduling
    "apscheduler>=3.10,<4",
    # Utilities
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-jose[cryptography]>=3.3,<4",
    "passlib[bcrypt]>=1.7,<2",
    "bcrypt>=3.2,<4",
    "python-multipart>=0.0.9,<1",
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]
