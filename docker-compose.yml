services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://sporttery:${POSTGRES_PASSWORD:-sporttery}@postgres:5432/sporttery
      - REDIS_URL=redis://redis:6379/0
      - DUCKDB_PATH=/data/snapshots/sporttery.duckdb
      - SKILLS_DIR=/app/skills
    volumes:
      - backend_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m workers.scheduler
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://sporttery:${POSTGRES_PASSWORD:-sporttery}@postgres:5432/sporttery
      - REDIS_URL=redis://redis:6379/0
      - DUCKDB_PATH=/data/snapshots/sporttery.duckdb
      - SKILLS_DIR=/app/skills
    volumes:
      - backend_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=sporttery
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sporttery}
      - POSTGRES_DB=sporttery
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sporttery"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_data:
